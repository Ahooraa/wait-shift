# Defaults for details the DFPS paper does NOT state (PLAN.md section 10 and DEVIATIONS.md). These are the
# neutral choices; each has a sensitivity run. They are logged into every result file. They are NOT paper facts.
A01_ranges_distribution: uniform            # distribution inside the Table-2 ranges
A02_initial_chromosome: uniform_multinomial # random placement vector per node (sums to ecc_k)
A03_proximity_uncovered: diameter_plus_1    # proximity level when a function is absent from the network
A04_crossover_node_subset_p: 0.5            # each node independently swapped with this probability
A05_crossover_prob: 0.9                     # NSGA-II standard (Deb et al. 2002)
A05_mutation_per_node_prob: null            # null -> 1/Ne per node (about one mutation move per offspring)
A06_generations: 250
A07_matching_k_best: 10
A07_matching_trees: 5
A08_vicinity_hops: 2
A09_root_source_term: true                  # virtual source g-node at the request origin (Q-3)
A10_unstable_fst: queue_based               # (queued+1) * exec_time / instances
A11_sa_t_max: 10.0                          # seconds (typical AET magnitude)
A11_sa_alpha: 0.95
A11_sa_iterations: 100                      # T_min = T_max * alpha^iterations
A12_move_pending_states: true
A13_exec_time_distribution: exponential     # mean = exec_time_l (the paper's own queueing assumption, p.7)
A14_lambda_window_s: 5
A14_lambda_update_s: 1
A15_workflow_sampling: uniform_eligible
A16_function_type_mapping: global_pool_uniform
A17_function_pool_size: 30
A18_request_input_state: same_range_as_states
A19_topology: transit_stub_single_transit_domain
A20_origin: uniform_random_node
A21_run_length_s: 300
A21_warmup_s: 30
A22_utilization: busy_time_over_capacity_time
A23_storage: reserve_at_planning_release_on_completion
A24_unplannable_requests: wait_and_retry
A25_reroute_when_no_instance: aet_rule
A26_aet_service_estimate: list_scheduling_mean_residual
A27_ewf_definition: placed_instances_warm_or_warming
A28_storage_repair_in_matching: iterative_remove_overloaded
A29_alibaba_job_duration: end_minus_start_span
A30_transfer_aggregation: sum              # AET and relocation transfer: summed, as the paper text says
A31_reject_move_if_last_instance: true
A32_same_function_move: noop
